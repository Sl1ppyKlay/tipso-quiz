$("#v-learn").innerHTML=`
<p class="lead">Жёлтым выделено короткое определение: его и учи. Нажми на термин, чтобы раскрыть подробности.</p>

<h2 id="s1">1. Термины (26)</h2>
<div id="termlist">${terms}</div>

<h2 id="s2">2. Экспресс-вопросы</h2>
<h3>2.1 Жизненный цикл ОМ</h3>
<div class="tbl"><table><tr><th>Стадия</th><th>Что включает</th></tr>
<tr><td>1. Возникновение</td><td>индивидуальные мнения → обмен мнениями → кристаллизация общей точки зрения → объективизация</td></tr>
<tr><td>2. Функционирование</td><td><mark>этап объективизации</mark> (готовность реализовать оценку в поведении) + <mark>этап активности</mark> (участие в массовых акциях)</td></tr>
<tr><td>3. Убывание</td><td>падает интерес и интенсивность, размывается большинство, ОМ распадается на разрозненные суждения</td></tr></table></div>
<p class="hint">В словаре ЭУК этапы названы иначе: формирование → функционирование → спад.</p>
<h3>2.2 Структура ОМ (3 компонента)</h3>
<p><mark>Рациональный</mark> — знания, суждения. <mark>Эмоциональный</mark> — чувства, настроения. <mark>Волевой</mark> — готовность действовать.</p>
<h3>2.3 Признаки ОМ (5)</h3>
<ul><li><b>Направленность</b> — «за» или «против»</li><li><b>Интенсивность</b> — сила выражения</li><li><b>Стабильность</b> — устойчивость во времени</li><li><b>Информационная насыщенность</b> — объём знаний об объекте</li><li><b>Социальная поддержка</b> — уверенность, что мнение разделяют другие</li></ul>
<h3>2.4 Функции ОМ (5)</h3>
<p>Регулятивная, оценочная, контрольная (контроль за властью), защитная (права граждан), экспрессивная (эмоции).</p>
<h3>2.5 Группы общественности по Гендриксу (7)</h3>
<p>1) работники СМИ; 2) внутренняя общественность; 3) местные жители; 4) инвесторы; 5) госорганы; 6) потребители; 7) группы особенных интересов.</p>
<h3>2.6 Классификация групп общественности</h3>
<div class="tbl"><table><tr><th>Основание</th><th>Группы</th></tr>
<tr><td>По месту</td><td>внутренняя / внешняя</td></tr>
<tr><td>По значимости</td><td>главная, второстепенная, маргинальная; традиционная и будущая; сторонники, оппоненты, безразличные</td></tr>
<tr><td>По отношению сейчас</td><td>активные / латентные</td></tr>
<tr><td>Целевые и приоритетные</td><td>—</td></tr>
<tr><td>По воздействию</td><td>положительные / отрицательные</td></tr>
<tr><td>По влиянию</td><td>скрытая власть («серые кардиналы»), группы членства, группы лидерства</td></tr>
<tr><td>По характеристикам</td><td>психографический, географический, демографический подходы</td></tr></table></div>
<p><b>Закономерности:</b> общественность состоит из многих целевых общественностей; один человек может входить в несколько; складывается стихийно или целенаправленно; направленность непостоянна.</p>
<h3>2.7 Четыре модели PR (Грюниг и Хант, 1984)</h3>
<div class="tbl"><table><tr><th>Модель</th><th>Время</th><th>Суть</th><th>Кто</th></tr>
<tr><td>Пресс-агентство</td><td>2-я пол. XIX в.</td><td>пропаганда любыми способами, односторонняя</td><td>Барнум; шоу-бизнес, спорт</td></tr>
<tr><td>Информирование</td><td>1900–1920</td><td>правдивая информация, односторонняя</td><td>А. Ли; госструктуры, НКО</td></tr>
<tr><td>Асимметричная</td><td>1920–1960</td><td>обратная связь ради манипуляции ОМ</td><td>Бернейз; бизнес в конкуренции</td></tr>
<tr><td>Симметричная</td><td>с 1960-х</td><td>диалог ради взаимопонимания</td><td>широкий круг организаций</td></tr></table></div>
<h3>2.8 Режимы власть–ОМ (Гавра)</h3>
<p>Подавление → игнорирование → патернализм → сотрудничество → давление ОМ на власть → диктатура ОМ.</p>
<h3>2.9 История термина</h3>
<p>«Public opinion» — Англия, XII в., <mark>Джон Солсберийский</mark>, «Поликратик». Общепринятым стал с конца XVIII в.</p>

<h2 id="s3">3. Спираль молчания</h2>
<div class="key"><p><b>Ноэль-Нойман (Германия).</b> Люди боятся высказываться из страха изоляции, поэтому громко звучащее мнение может быть не мнением большинства.</p></div>
<ul><li>Человек оценивает «климат мнений».</li><li>Кто думает, что он в большинстве, говорит; кто в меньшинстве — молчит.</li><li>Молчание усиливает видимость большинства, спираль раскручивается.</li><li>СМИ показывают, какое мнение «доминирует».</li></ul>
<p>ОМ у Ноэль-Нойман — давление конформизма: человек дорожит именем и боится изоляции.</p>
<div class="tbl"><table><tr><th>Учёный</th><th>Позиция</th></tr>
<tr><td>Тард, 1902</td><td>толпа и публика; ОМ порождает публика</td></tr>
<tr><td>Лоуэлл, 1926</td><td>компетентность ОМ ограничена</td></tr>
<tr><td>Липпман, 1922</td><td>обыватель мыслит стереотипами</td></tr>
<tr><td>Хабермас</td><td>ОМ — инструмент господствующих классов, «официальное»</td></tr>
<tr><td>Луман</td><td>нет субъекта ОМ, важны темы коммуникации</td></tr>
<tr><td>Ноэль-Нойман</td><td>давление конформизма, спираль молчания</td></tr></table></div>

<h2 id="s4">4. Вопросы семинаров</h2>
<h3>Причины и источники PR</h3>
<p><b>Причины:</b> политические (демократия, выборы), экономические (рынок, конкуренция, корпорации), общественные (массовое общество, грамотность, пресса).</p>
<p><b>Источники:</b> риторика, журналистика, реклама, пропаганда.</p>
<h3>США — 5 этапов</h3>
<div class="tbl"><table><tr><th>Период</th><th>Содержание</th></tr>
<tr><td>XVII в. — 1810-е</td><td>политический PR</td></tr><tr><td>1810-е — конец XIX в.</td><td>паблисити, пресс-агентства</td></tr><tr><td>нач. XX в. — 1940-е</td><td>становление профессии и науки</td></tr><tr><td>1940-е — 1970-е</td><td>планирование, двусторонние модели</td></tr><tr><td>с 1980-х</td><td>контроль PR, глобализация, диджитализация</td></tr></table></div>
<h3>Европа</h3>
<p>PR институционализировался после Второй мировой. 4 эры по Ку де Фейаку: 1945–55 «примитивная», 1955–70-е «философия компании», 1970–80-е «расширение рынков», с 1990-х — глобальный информационный рынок.</p>
<h3>Россия — 7 периодов</h3>
<div class="tbl"><table><tr><th>Период</th><th>Главное</th></tr>
<tr><td>с 1988</td><td>доинституциональный: пресс-службы, первые агентства</td></tr>
<tr><td>с 1991</td><td>первичная институционализация, РАСО</td></tr>
<tr><td>с 1994</td><td>вторичная институционализация, Декларация (1994)</td></tr>
<tr><td>с 1998</td><td>дефолт, регионы, Кодекс (2001)</td></tr>
<tr><td>2008–2010</td><td>госPR, двухуровневое образование</td></tr>
<tr><td>сер. 2010-х</td><td>digital, сторителлинг, GR, профстандарт</td></tr>
<tr><td>конец 2010-х</td><td>глобально-технологический: цифра и ИИ</td></tr></table></div>
<h3>PR как функция управления</h3>
<p>Специалист вырос до консультанта и менеджера; симметричная модель делает PR частью стратегического управления. Для России эффективнее симметричная модель.</p>
<h3>Античность и публичная сфера</h3>
<p>Риторика и публичная речь на площади — истоки публичных коммуникаций. Публичная сфера (Хабермас) — «место», где формируется ОМ. PR есть только при демократии; в тоталитаризме — пропаганда. Сегодня есть виртуальная публичная сфера.</p>
<h3>PR как социальный феномен</h3>
<p>Цели: оптимизация коммуникационной среды, паблицитный капитал (имидж, репутация, позитивное ОМ). <mark>Задачи по Катлипу:</mark> привлечь внимание → стимулировать интерес → сформировать намерение → направить действия.</p>
<h3>Профессиональная деятельность</h3>
<p><b>Сферы:</b> политическая (электоральный, государственный PR), экономическая (бизнес-PR), социальная (НКО), культура.</p>
<p><b>Профессиограмма</b> — описание требований профессии: знания, деловые и личностные качества. <b>Психограмма</b> — только психологические качества, часть профессиограммы.</p>
<p><b>Рынок PR</b> — купля-продажа услуг; <b>сфера PR</b> шире, включая некоммерческую. <b>Квалификационная характеристика</b> — нормативный документ по должности (Минтруд, 28.07.2003). Профстандарт разработало РАСО.</p>
<p>Сегела: специалист — «инженер и архитектор, поэт и бухгалтер».</p>
<h3>Дальневосточная школа PR</h3>
<ul><li>Кафедра рекламы и СО ТОГУ (Хабаровск), первый набор — 2003.</li><li>Основатель — <mark>С. П. Понарина</mark>; опора на Петербургскую школу.</li><li>Тема — имидж Дальнего Востока, брендинг территории (Маркина, 2010).</li><li>Сообщество — 2016 (Понарина, Маркина, Пестова); партнёрство с РАСО — 2017.</li><li>Функции: просветительская, информационная, аналитическая.</li><li>Приморье — с 1995, больше практика; Хабаровск — с 2003, гуманитарный подход.</li></ul>
<h3>Теория ОМ</h3>
<div class="tbl"><table><tr><th>Вопрос</th><th>Ответ</th></tr>
<tr><td>Принципы</td><td>историзм, системность, объективность, социальная обусловленность, единство теории и эмпирики</td></tr>
<tr><td>Объект / предмет</td><td>ОМ как явление / закономерности его формирования и развития</td></tr>
<tr><td>Двойственность</td><td>духовное (оценки) и практическое (действия)</td></tr>
<tr><td>Субъект / носитель / выразитель</td><td>формирует / разделяет / озвучивает (лидеры, СМИ)</td></tr>
<tr><td>Пути формирования</td><td>стихийный (опыт, слухи) и сознательный (СМИ, PR)</td></tr>
<tr><td>Все ли стадии?</td><td>нет: может угаснуть или «перескочить» стадии</td></tr>
<tr><td>Средства</td><td>СМИ, лидеры мнений, мероприятия; убеждение, внушение, заражение, подражание</td></tr>
<tr><td>Исследования</td><td>опросы, фокус-группы, экспертные опросы, контент-анализ</td></tr>
<tr><td>Алгоритм</td><td>исследование → планирование → коммуникация → оценка</td></tr></table></div>
<p><b>Массовое сознание</b> — стихийное, эмоциональное, со стереотипами. ОМ — выраженная оценочная часть общественного сознания.</p>
<p><b>Лидеры мнений</b> — 10–12 % населения; в диджитале — инфлюенсеры. Журналисты — первая группа у Гендрикса и релейная аудитория.</p>
<h3>Публика и общественность</h3>
<div class="tbl"><table><tr><th></th><th>Публика</th><th>Общественность</th></tr>
<tr><td>Объединяет</td><td>общий источник информации</td><td>общие интересы и ценности</td></tr>
<tr><td>Позиция</td><td>пассивная</td><td>активный субъект</td></tr>
<tr><td>Итог</td><td>аудитория</td><td>участник публичной сферы</td></tr></table></div>

<h2 id="s5">5. Закон «О рекламе»</h2>
<p><b>Федеральный закон от 13 марта 2006 г. № 38-ФЗ «О рекламе».</b> Вместе с законами «О СМИ» (1991), № 8-ФЗ (о доступе к информации о деятельности госорганов) и № 149-ФЗ «Об информации…» он регулирует российский PR.</p>
<p>В законе информационный подход: реклама — это информация (сообщение). Закон регулирует и рекламные сообщения, и рекламную деятельность.</p>
<div class="key"><p><b>Реклама (ст. 3)</b> — информация, распространённая любым способом, в любой форме и любыми средствами, адресованная <mark>неопределённому кругу лиц</mark> и направленная на привлечение внимания к объекту рекламирования, формирование или поддержание интереса к нему и его продвижение на рынке.</p></div>
<h3>Главное по закону</h3>
<ul>
<li><b>Объект рекламирования</b> — товар, средство индивидуализации, изготовитель или продавец, результат интеллектуальной деятельности, мероприятие.</li>
<li><b>Участники</b> — рекламодатель (заказчик), рекламопроизводитель (создаёт рекламу), рекламораспространитель (размещает), потребитель рекламы.</li>
<li>Реклама должна быть <b>добросовестной и достоверной</b> (ст. 5). <b>Ненадлежащая реклама</b> — та, что нарушает требования закона.</li>
<li><b>Социальная реклама</b> (ст. 10) — для благотворительных и общественно полезных целей, без упоминания конкретных марок товаров.</li>
<li><b>Ограничения:</b> защита несовершеннолетних (ст. 6); запрет рекламы ряда товаров, в т. ч. табака (ст. 7); объём рекламы на ТВ и радио (ст. 14–15); рассылки только с согласия абонента (ст. 18); маркировка интернет-рекламы (ст. 18.1, с 2022 г.); особые правила для алкоголя, лекарств, финансовых услуг (ст. 21–28).</li>
<li><b>Контроль</b> — <mark>ФАС России</mark>. <b>Ответственность</b> — КоАП РФ, ст. 14.3.</li>
</ul>
<h3>Реклама и PR</h3>
<p><b>Реклама</b> (словарь ЭУК) — однонаправленная форма неличной коммуникации на платной основе, чтобы привлечь внимание к объекту рекламирования.</p>
<p><b>PR</b> — двусторонняя управленческая коммуникация с общественностью. Его цель — взаимопонимание и паблицитный капитал, а не прямая продажа.</p>

$("#q").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase();document.querySelectorAll("#termlist .term").forEach(d=>{d.hidden=v&&!d.dataset.q.includes(v);if(v&&!d.hidden)d.open=true})});

// ===== КАРТОЧКИ =====
let C={deck:"terms",queue:[],i:0,flip:false,known:0,total:0};
function deckItems(d){return d==="terms"?TERMS.map(t=>({f:t[0],b:t[1],x:t[2]})):PEOPLE.map(p=>({f:p[0],b:p[2],x:p[1]}))}
function startCards(d){C.deck=d;C.queue=shuffle(deckItems(d));C.total=C.queue.length;C.known=0;C.flip=false;drawCards()}
function drawCards(){
  const v=$("#v-cards");const done=!C.queue.length;const c=C.queue[0];
  v.innerHTML=`<p class="lead">Вспомни ответ, потом переверни карточку. «Не знаю» вернёт её в колоду.</p>
  <div class="chips" role="group" aria-label="Колода"><button data-d="terms" aria-pressed="${C.deck==="terms"}">Термины (26)</button><button data-d="people" aria-pressed="${C.deck==="people"}">Персоналии (${PEOPLE.length})</button></div>
  <div class="bar"><i style="width:${C.known/C.total*100}%"></i></div>
  <p class="stat">выучено ${C.known} из ${C.total}</p>
  ${done?`<div class="panel" style="text-align:center"><p class="big">Готово</p><p>Все карточки выучены.</p><div class="row" style="justify-content:center;margin-top:10px"><button class="primary" id="again">Ещё раз</button></div></div>`:
  `<div class="panel card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
    <div class="eyebrow">${C.deck==="terms"?"термин":"персоналия"}</div>
    <div class="front">${esc(c.f)}</div>
    ${C.flip?`<div class="back"><b>${esc(c.b)}</b></div>${c.x?`<div class="extra">${esc(c.x)}</div>`:""}`:`<div class="hint">нажми или пробел, чтобы перевернуть</div>`}
  </div>
  <div class="row" style="margin-top:12px;justify-content:center">
    <button id="no" ${C.flip?"":"disabled"}>Не знаю</button>
    <button class="primary" id="yes" ${C.flip?"":"disabled"}>Знаю</button>
  </div>`}`;
  v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>startCards(b.dataset.d));
  if(done){$("#again").onclick=()=>startCards(C.deck);return}
  $("#card").onclick=()=>{C.flip=!C.flip;drawCards();$("#card")?.focus()};
  $("#yes").onclick=()=>{C.queue.shift();C.known++;C.flip=false;drawCards()};
  $("#no").onclick=()=>{const x=C.queue.shift();C.queue.splice(Math.min(3,C.queue.length),0,x);C.flip=false;drawCards()};
}

// ===== ТЕСТ =====
let Q={mode:"all",n:15,list:[],i:0,score:0,answered:false,wrong:[]};
function makeQuestions(mode){
  const qs=[];
  if(mode==="all"||mode==="terms"){
    TERMS.forEach((t,i)=>{
      const others=shuffle(TERMS.filter((_,j)=>j!==i)).slice(0,3);
      qs.push({q:`Что такое «${t[0]}»?`,a:t[1],w:others.map(o=>o[1]),x:t[2],id:"td"+i});
      qs.push({q:`Какой термин: «${t[1]}»?`,a:t[0],w:others.map(o=>o[0]),x:"",id:"dt"+i});
    });
  }
  if(mode==="all"||mode==="people"){
    PEOPLE.forEach((p,i)=>{
      const others=shuffle(PEOPLE.filter((_,j)=>j!==i)).slice(0,3);
      qs.push({q:`Кто: ${p[2]}?`,a:`${p[0]} (${p[1]})`,w:others.map(o=>`${o[0]} (${o[1]})`),x:"",id:"pp"+i});
    });
  }
  if(mode==="all"||mode==="facts"){FACTS.forEach((f,i)=>qs.push({q:f[0],a:f[1],w:f[2],x:f[3],id:"ff"+i}))}
  return qs;
}
function startQuiz(list){
  const pool=list||shuffle(makeQuestions(Q.mode));
  Q.list=(list?shuffle(list):pool.slice(0,Q.n==="all"?pool.length:Q.n)).map(q=>({...q,opts:shuffle([q.a,...q.w])}));
  Q.i=0;Q.score=0;Q.answered=false;Q.wrong=[];drawQuiz();
}
function quizSetup(){
  const v=$("#v-quiz");
  const modes=[["all","Всё вперемешку"],["terms","Термины"],["facts","Экспресс-вопросы"],["people","Персоналии"]];
  const ns=[[10,"10"],[15,"15"],[30,"30"],["all","Все"]];
  v.innerHTML=`<p class="lead">Выбери тему и количество вопросов. Ошибки сохраняются во вкладке «Ошибки».</p>
  <div class="panel">
  <div class="eyebrow">тема</div><div class="chips" role="group" aria-label="Тема">${modes.map(m=>`<button data-m="${m[0]}" aria-pressed="${Q.mode===m[0]}">${m[1]}</button>`).join("")}</div>
  <div class="eyebrow" style="margin-top:10px">вопросов</div><div class="chips" role="group" aria-label="Количество">${ns.map(n=>`<button data-n="${n[0]}" aria-pressed="${String(Q.n)===String(n[0])}">${n[1]}</button>`).join("")}</div>
  <div class="row" style="margin-top:14px"><button class="primary" id="go">Начать тест</button><span class="stat">лучший результат: ${store.get("best",0)}%</span></div></div>`;
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{Q.mode=b.dataset.m;quizSetup()});
  v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{Q.n=b.dataset.n==="all"?"all":+b.dataset.n;quizSetup()});
  $("#go").onclick=()=>startQuiz();
}
function drawQuiz(){
  const v=$("#v-quiz");
  if(Q.i>=Q.list.length){
    const pct=Math.round(Q.score/Q.list.length*100);
    if(pct>store.get("best",0))store.set("best",pct);
    v.innerHTML=`<div class="panel" style="text-align:center"><div class="eyebrow">результат</div><p class="big">${Q.score} / ${Q.list.length}</p><p>${pct>=90?"Отлично, ты готов.":pct>=70?"Хорошо. Повтори ошибки.":"Пройди карточки и попробуй ещё раз."}</p>
    <div class="row" style="justify-content:center;margin-top:12px">${Q.wrong.length?`<button class="primary" id="redo">Повторить ошибки (${Q.wrong.length})</button>`:""}<button id="new">Новый тест</button></div></div>
    ${Q.wrong.length?`<h2>Где ошибся</h2>${Q.wrong.map(w=>`<div class="mistake"><b>${esc(w.q)}</b>${esc(w.a)}</div>`).join("")}`:""}`;
    if(Q.wrong.length)$("#redo").onclick=()=>startQuiz(Q.wrong.slice());
    $("#new").onclick=quizSetup;return;
  }
  const q=Q.list[Q.i];
  v.innerHTML=`<div class="row" style="justify-content:space-between"><span class="stat">вопрос ${Q.i+1} из ${Q.list.length}</span><span class="stat">верно: ${Q.score}</span></div>
  <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
  <div class="panel"><p class="q">${esc(q.q)}</p><div class="opts">${q.opts.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>
  <div class="row" style="margin-top:12px;justify-content:space-between"><button id="quit">Выйти</button><button class="primary" id="next" hidden>Дальше</button></div>`;
  v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#quit").onclick=quizSetup;
  $("#next").onclick=()=>{Q.i++;Q.answered=false;drawQuiz()};
}
function answer(k){
  if(Q.answered)return;Q.answered=true;
  const q=Q.list[Q.i];const ok=q.opts[k]===q.a;
  const btns=document.querySelectorAll("#v-quiz [data-k]");
  btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  const m=store.get("mistakes",{});
  if(ok){Q.score++;delete m[q.id]}else{Q.wrong.push(q);m[q.id]={q:q.q,a:q.a,w:q.w,x:q.x,id:q.id}}
  store.set("mistakes",m);
  $("#fb").innerHTML=`<p class="fb ${ok?"ok":"bad"}">${ok?"Верно.":"Неверно. Правильно: "+esc(q.a)}</p>${q.x?`<p class="hint">${esc(q.x)}</p>`:""}`;
  const n=$("#next");n.hidden=false;n.focus();
}

// ===== ОШИБКИ =====
function renderMistakes(){
  const m=Object.values(store.get("mistakes",{}));const v=$("#v-mistakes");
  v.innerHTML=m.length?`<p class="lead">Вопросы, в которых ты ошибся. Ответишь верно — вопрос исчезнет отсюда.</p>
  <div class="row"><button class="primary" id="mq">Пройти ошибки (${m.length})</button><button id="mc">Очистить</button></div>
  ${m.map(w=>`<div class="mistake"><b>${esc(w.q)}</b>${esc(w.a)}</div>`).join("")}`
  :`<div class="panel"><p><b>Ошибок пока нет.</b></p><p class="hint">Пройди тест: вопросы, на которые ответишь неверно, появятся здесь.</p><div class="row" style="margin-top:10px"><a href="#quiz"><button class="primary">Перейти к тесту</button></a></div></div>`;
  if(m.length){$("#mq").onclick=()=>{location.hash="quiz";setTimeout(()=>startQuiz(m),0)};$("#mc").onclick=()=>{store.set("mistakes",{});renderMistakes()}}
}

// ===== РОУТИНГ =====
const VIEWS=["learn","cards","quiz","mistakes"];
let inited={};
function route(){
  let h=location.hash.slice(1);
  if(!VIEWS.includes(h)){
    // якоря внутри конспекта
    if(/^s\d$/.test(h)){showView("learn");document.getElementById(h)?.scrollIntoView();return}
    h="learn";
  }
  showView(h);window.scrollTo(0,0);
}
function showView(h){
  VIEWS.forEach(x=>{$("#v-"+x).hidden=x!==h});
  document.querySelectorAll("nav a").forEach(a=>a.getAttribute("href")==="#"+h?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(h==="learn"&&!inited.learn){renderLearn();inited.learn=1}
  if(h==="cards"&&!inited.cards){startCards("terms");inited.cards=1}
  if(h==="quiz"&&!inited.quiz){quizSetup();inited.quiz=1}
  if(h==="mistakes")renderMistakes();
}
document.addEventListener("keydown",e=>{
  if(!$("#v-cards").hidden&&e.target.tagName!=="INPUT"){
    if(e.code==="Space"){e.preventDefault();$("#card")?.click()}
    if(C.flip&&e.key==="ArrowRight")$("#yes")?.click();
    if(C.flip&&e.key==="ArrowLeft")$("#no")?.click();
  }
  if(!$("#v-quiz").hidden&&/^[1-4]$/.test(e.key)&&!Q.answered){const b=document.querySelector(`#v-quiz [data-k="${+e.key-1}"]`);b?.click()}
});
window.addEventListener("hashchange",route);
route();
</script>
