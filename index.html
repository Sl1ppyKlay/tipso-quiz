<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТиПСО: квиз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: игровой экран одной колонкой ~720px; выбор темы и ответы — крупные карточки 2×2 */
:root{
  --bg:#eef0fa; --paper:#ffffff; --fg:#151a33; --muted:#5d6488; --line:#d8dcef;
  --ink:#3046d6; --ink-2:#7a3fe0; --ink-soft:#e5e9ff; --gold:#f2b400; --gold-soft:#fff3c4;
  --ok:#0f8f5c; --ok-soft:#d9f6e8; --bad:#d23452; --bad-soft:#fde2e8; --shadow:0 6px 0 #c9cee8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1120; --paper:#1a1d33; --fg:#eceefa; --muted:#a0a6cc; --line:#2d3253;
  --ink:#8b9cff; --ink-2:#b48cff; --ink-soft:#252c58; --gold:#ffcf3f; --gold-soft:#3d3412;
  --ok:#47d69a; --ok-soft:#123a2a; --bad:#ff7891; --bad-soft:#401a26; --shadow:0 6px 0 #0a0c18; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 14px}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.01em;text-decoration:none;color:var(--fg)}
.logo span{color:var(--ink)}
.toplinks{display:flex;gap:8px}
.pill{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
h1{font-family:var(--f-display);font-size:clamp(26px,6vw,40px);line-height:1.1;margin:8px 0 6px;text-wrap:balance}
h2{font-family:var(--f-display);font-size:18px;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.stat{font-family:var(--f-mono);font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
/* карточки тем */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{position:relative;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .12s, border-color .12s}
.tcard:hover{transform:translateY(-3px);border-color:var(--ink)}
.tcard:active{transform:translateY(3px);box-shadow:none}
.tcard .ic{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ink);line-height:1}
.tcard b{font-size:17px}
.tcard small{color:var(--muted);font-size:13px}
.tcard .meter{margin-top:auto;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.tcard .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ink),var(--ink-2))}
.tcard .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tcard.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tcard.wide .ic{font-size:22px}
.toggle{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-weight:600;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
/* игра */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lives{font-size:22px;letter-spacing:2px;color:var(--bad)}
.lives .lost{color:var(--line)}
.score{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:4px 9px;border-radius:8px;background:var(--gold-soft);color:var(--fg);border:1px solid var(--gold)}
.combo.off{opacity:.35}
.timer{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.timer i{display:block;height:100%;background:var(--ink);width:100%}
.timer.low i{background:var(--bad)}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px 20px;margin:14px 0;box-shadow:var(--shadow);text-align:center}
.qcard .tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink)}
.qcard .qq{font-size:clamp(18px,4.4vw,23px);font-weight:700;line-height:1.3;margin:8px 0 0;text-wrap:balance}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;perspective:900px}
.ans{position:relative;min-height:110px;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 12px 12px 38px;text-align:left;
  font-size:15px;font-weight:500;line-height:1.35;box-shadow:var(--shadow);transition:transform .12s,border-color .12s,background .2s;animation:deal .35s both}
.ans:nth-child(2){animation-delay:.05s}.ans:nth-child(3){animation-delay:.1s}.ans:nth-child(4){animation-delay:.15s}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotateX(25deg)}to{opacity:1;transform:none}}
.ans .k{position:absolute;left:11px;top:12px;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.ans:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.ans:disabled{cursor:default}
.ans.ok{background:var(--ok-soft);border-color:var(--ok);animation:pop .35s}
.ans.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
.ans.dim{opacity:.45}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.fb .v{font-weight:700}
.fb .v.ok{color:var(--ok)} .fb .v.bad{color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--muted);font-size:15px}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--gold);pointer-events:none;animation:up 1s forwards;text-shadow:0 2px 0 var(--paper)}
@keyframes up{to{opacity:0;transform:translate(-50%,-60px)}}
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--ink);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.end{text-align:center}
.end .big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,12vw,72px);margin:6px 0;background:linear-gradient(90deg,var(--ink),var(--ink-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank{display:inline-block;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold)}
.miss{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;text-align:left}
.miss b{display:block;margin-bottom:2px}
.miss span{color:var(--ok);font-weight:600}
/* флэш-карточки */
.flip{perspective:1200px;margin:14px 0}
.flip-in{position:relative;min-height:280px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:10px}
.face.back{transform:rotateY(180deg);border-color:var(--ink)}
.face .t{font-family:var(--f-display);font-size:clamp(20px,5vw,28px);font-weight:700;line-height:1.2;text-wrap:balance}
.face .d{font-size:18px;font-weight:600;text-wrap:balance}
.face .x{font-size:14px;color:var(--muted);text-align:left;max-height:120px;overflow:auto}
.hint{font-size:13px;color:var(--muted)}
.btn.no{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.yes{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.center{justify-content:center}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.actions{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:10px 0 max(10px,env(safe-area-inset-bottom));margin-top:14px;justify-content:space-between}
@media (max-width:520px){
  body{padding-bottom:16px}
  .answers{grid-template-columns:1fr;gap:8px}
  .ans{min-height:56px;padding:13px 12px 13px 36px;font-size:15.5px}
  .qcard{padding:18px 14px;margin:10px 0}
  .grid{gap:10px}.tcard{min-height:130px;padding:14px}
  .btn{padding:14px 16px}
  .actions .btn{flex:1 1 auto}
  .actions>.row{flex:1 1 auto}
  .flip-in{min-height:300px}
  .float{top:30%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="#" id="home">ТиПСО<span>.квиз</span></a>
    <div class="toplinks"><a class="pill" href="konspekt.html">Конспект</a><a class="pill" href="tipso-shpargalka.pdf" target="_blank" rel="noopener">PDF</a></div>
  </div>
  <main id="app"></main>
</div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem("tipsoq_"+k);const p=v?JSON.parse(v):null;return p??d}catch(e){return d}},set(k,v){try{localStorage.setItem("tipsoq_"+k,JSON.stringify(v))}catch(e){}}};

// ===== вопросы =====
function allQuestions(){
  const out={terms:[],facts:[],people:[]};
  TERMS.forEach((t,i)=>{
    const o=shuffle(TERMS.filter((_,j)=>j!==i)).slice(0,3);
    out.terms.push({id:"td"+i,tag:"термин → определение",q:`${t[0]} — это…`,a:t[1],w:o.map(x=>x[1]),x:t[2]});
    out.terms.push({id:"dt"+i,tag:"определение → термин",q:`«${t[1]}»`,a:t[0],w:o.map(x=>x[0]),x:""});
  });
  PEOPLE.forEach((p,i)=>{
    const o=shuffle(PEOPLE.filter((_,j)=>j!==i)).slice(0,3);
    out.people.push({id:"pw"+i,tag:"кто это?",q:`${p[2][0].toUpperCase()+p[2].slice(1)}`,a:p[0],w:o.map(x=>x[0]),x:`${p[0]} — ${p[1]}`});
    out.people.push({id:"pv"+i,tag:"чем известен?",q:`${p[0]} (${p[1]})`,a:p[2],w:o.map(x=>x[2]),x:""});
  });
  FACTS.forEach((f,i)=>out.facts.push({id:"ff"+i,tag:"экспресс-вопрос",q:f[0],a:f[1],w:f[2],x:f[3]}));
  return out;
}
const QS=allQuestions();
const TOPICS=[
  {k:"terms",ic:"26",name:"Термины",desc:"Определения из блица",list:()=>QS.terms},
  {k:"facts",ic:"?!",name:"Экспресс-вопросы",desc:"ОМ, модели PR, история, закон",list:()=>QS.facts},
  {k:"people",ic:"Кто",name:"Персоналии",desc:"Кто что сделал",list:()=>QS.people},
  {k:"mix",ic:"∞",name:"Микс",desc:"Всё вперемешку",list:()=>[...QS.terms,...QS.facts,...QS.people]}
];
const mastered=()=>store.get("mastered",{});
const mistakes=()=>store.get("mistakes",{});
function topicPct(t){const m=mastered();const l=t.list();return Math.round(l.filter(q=>m[q.id]).length/l.length*100)}

// ===== главный экран =====
function home(){
  stopTimer();
  const best=store.get("best",0),mis=Object.keys(mistakes()).length;
  const all=TOPICS[3];
  const sg=store.get("game",null);
  const sgName=sg?(sg.k==="mistakes"?"Работа над ошибками":(TOPICS.find(t=>t.k===sg.k)||{}).name):"";
  app.innerHTML=`
  <h1>Выучи ТиПСО, играя</h1>
  <p class="sub">Выбирай карточку с ответом. 3 жизни, таймер, комбо за серию верных ответов. Прогресс сохраняется на этом устройстве.</p>
  <div class="stats"><span class="stat">рекорд ${best}</span><span class="stat">выучено ${topicPct(all)}%</span><span class="stat">ошибок ${mis}</span></div>
  ${sg&&sg.list&&sg.i<sg.list.length?`<div class="grid" style="margin-top:14px"><button class="tcard wide" id="resume" style="border-color:var(--ink)"><span class="ic">▶</span><span><b>Продолжить игру</b><br><small>${esc(sgName)} · вопрос ${sg.i+1} из ${sg.list.length} · ${sg.score} очков</small></span></button></div>
  <div class="row" style="margin-top:8px"><button class="btn ghost" id="restart">↺ Начать эту тему заново</button><button class="btn ghost" id="drop">Удалить сохранение</button></div>`:""}
  <h2>Играть</h2>
  <div class="grid">${TOPICS.map(t=>{const p=topicPct(t);return`<button class="tcard" data-t="${t.k}"><span class="ic">${t.ic}</span><b>${t.name}</b><small>${t.desc} · ${t.list().length} вопр.</small><span class="pct">выучено ${p}%</span><span class="meter"><i style="width:${p}%"></i></span></button>`}).join("")}
  <button class="tcard wide" data-t="mistakes" ${mis?"":"disabled style='opacity:.5;cursor:default'"}><span class="ic">✗</span><span><b>Работа над ошибками</b><br><small>${mis?mis+" вопр. — ответишь верно, вопрос уйдёт":"ошибок пока нет"}</small></span></button>
  </div>
  <label class="toggle"><input type="checkbox" id="calm" ${store.get("calm",false)?"checked":""}> Спокойный режим: без таймера и без жизней</label>
  <h2>Учить</h2>
  <div class="grid">
    <button class="tcard wide" id="review"><span class="ic">≡</span><span><b>Разбор ошибок</b><br><small>${mis?"Список вопросов, где ты ошибся, с правильными ответами":"Здесь появятся вопросы, где ты ошибся"}</small></span></button>
    <button class="tcard" data-f="terms"><span class="ic">⟲</span><b>Карточки: термины</b><small>Переворачивай и запоминай</small></button>
    <button class="tcard" data-f="people"><span class="ic">⟲</span><b>Карточки: персоналии</b><small>Кто — страна — вклад</small></button>
  </div>
  <h2>Начать с нуля</h2>
  <div id="resetbox" class="row"><button class="btn ghost" id="reset">Сбросить весь прогресс</button><span class="hint">обнулит выученное, ошибки, рекорд и сохранённую игру</span></div>`;
  $("#reset").onclick=()=>{$("#resetbox").innerHTML=`<b>Точно всё сбросить?</b><button class="btn no" id="ry">Да, сбросить</button><button class="btn ghost" id="rn">Нет</button>`;
    $("#ry").onclick=()=>{["mastered","mistakes","best","game"].forEach(k=>store.set(k,null));G=null;home()};$("#rn").onclick=home};
  if($("#restart"))$("#restart").onclick=()=>{const k=sg.k;store.set("game",null);startGame(k==="mistakes"&&!mis?"mix":k)};
  if($("#drop"))$("#drop").onclick=()=>{store.set("game",null);home()};
  $("#calm").onchange=e=>store.set("calm",e.target.checked);
  $("#review").onclick=reviewMistakes;
  if($("#resume"))$("#resume").onclick=resumeGame;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(b.dataset.t==="mistakes"){if(mis)startGame("mistakes")}else startGame(b.dataset.t)});
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>startFlash(b.dataset.f));
}

// ===== игра =====
let G=null,timerId=null;
const TIME=20;
function pickList(k){
  if(k==="mistakes")return shuffle(Object.values(mistakes()));
  const l=TOPICS.find(t=>t.k===k).list(),m=mastered();
  // сначала невыученные, потом остальные
  return [...shuffle(l.filter(q=>!m[q.id])),...shuffle(l.filter(q=>m[q.id]))];
}
function startGame(k){
  const calm=store.get("calm",false);
  const list=pickList(k).slice(0,k==="mistakes"?999:calm?20:999);
  G={k,calm,list,i:0,lives:3,score:0,combo:0,maxCombo:0,right:0,wrong:[],answered:false,t:TIME};
  nextQ();
}
function mult(){return Math.min(5,1+Math.floor(G.combo/3))}
function nextQ(){
  stopTimer();window.scrollTo(0,0);
  if(G.i>=G.list.length||(!G.calm&&G.lives<=0))return endGame();
  const q=G.list[G.i];q.opts=shuffle([q.a,...q.w]);q.chosen=undefined;q.left=TIME;
  G.answered=false;G.view=G.i;saveGame();renderQ();
}
function saveGame(){store.set("game",G)}
function resumeGame(){
  G=store.get("game",null);if(!G)return home();
  const q=G.list[G.i];if(!q.opts){q.opts=shuffle([q.a,...q.w]);q.left=TIME}
  if(q.left==null)q.left=TIME;
  // таймер после перезахода начинается заново, чтобы было честно
  if(q.chosen===undefined)q.left=TIME;
  G.view=G.i;window.scrollTo(0,0);renderQ();
}
function reviewMistakes(){
  stopTimer();window.scrollTo(0,0);
  const l=Object.values(mistakes());
  app.innerHTML=`<h1>Мои ошибки</h1><p class="sub">${l.length?"Прочитай правильные ответы, потом сыграй в «Работу над ошибками».":"Ошибок нет."}</p>
  ${l.map(w=>`<div class="miss"><small style="color:var(--muted)">${esc(w.tag||"")}</small><b>${esc(w.q)}</b><span>${esc(w.a)}</span>${w.x?`<p class="hint" style="margin:4px 0 0">${esc(w.x)}</p>`:""}</div>`).join("")}
  <div class="row actions">${l.length?`<button class="btn" id="play">Играть по ошибкам</button>`:""}<button class="btn ghost" id="menu">Меню</button></div>`;
  if(l.length)$("#play").onclick=()=>startGame("mistakes");
  $("#menu").onclick=home;
}
// показывает вопрос G.view: текущий (можно отвечать) или прошлый (только просмотр)
function renderQ(){
  stopTimer();
  const idx=G.view,q=G.list[idx],past=idx<G.i,done=q.chosen!==undefined,live=!past&&!done;
  app.innerHTML=`
  <div class="hud">
    ${G.calm?`<span class="progress">спокойный режим</span>`:`<span class="lives" aria-label="жизни: ${G.lives}">${[0,1,2].map(i=>`<span class="${i<G.lives?"":"lost"}">♥</span>`).join("")}</span>`}
    <span class="combo ${G.combo>=3?"":"off"}">комбо ×${mult()}</span>
    <span class="score">${G.score}</span>
  </div>
  ${G.calm?"":`<div class="timer${past?" paused":""}" id="tm"><i id="tb" style="width:${(q.left??0)/TIME*100}%"></i></div>`}
  <div class="progress">${past?`<b style="color:var(--ink)">просмотр прошлого вопроса</b> · `:""}вопрос ${idx+1}${G.k==="mix"&&!G.calm?"":" из "+G.list.length} · серия ${G.combo}</div>
  <div class="qcard"><div class="tag">${esc(q.tag)}</div><p class="qq">${esc(q.q)}</p></div>
  <div class="answers">${q.opts.map((o,j)=>{let c="";if(done){c=o===q.a?"ok":j===q.chosen?"bad":"dim"}
    return`<button class="ans ${c}" data-j="${j}" ${done?"disabled":""} style="${done?"animation:none":""}"><span class="k">${j+1}</span>${esc(o)}</button>`}).join("")}</div>
  <div id="fb">${done?fbHtml(q):""}</div>
  <div class="row actions">
    <div class="row"><button class="btn ghost" id="back" ${idx===0?"disabled style='opacity:.4'":""}>← Назад</button><button class="btn ghost" id="quit" title="Игра сохранится, продолжишь из меню">Меню</button><button class="btn ghost" id="fin">Завершить</button></div>
    ${past?`<button class="btn" id="fwd">${idx+1===G.i?"К текущему →":"Вперёд →"}</button>`:`<button class="btn" id="next" ${done?"":"hidden"}>Дальше →</button>`}
  </div>`;
  if(live)app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("#quit").onclick=()=>{stopTimer();saveGame();home()};
  $("#fin").onclick=endGame;
  $("#back").onclick=goBack;
  if(past)$("#fwd").onclick=goFwd;else $("#next").onclick=()=>{G.i++;nextQ()};
  if(live&&!G.calm)startTimer(q);
}
function fbHtml(q){
  const ok=q.opts[q.chosen]===q.a;
  return`<div class="fb"><span class="v ${ok?"ok":"bad"}">${ok?"Верно!":q.chosen<0?"Время вышло":"Мимо"}</span>${ok?"":` — правильно: <b>${esc(q.a)}</b>`}${q.x?`<p>${esc(q.x)}</p>`:""}</div>`;
}
function goBack(){if(G.view>0){G.view--;renderQ()}}
function goFwd(){if(G.view<G.i){G.view++;renderQ()}}
function startTimer(q){
  const start=performance.now(),from=q.left;
  const tick=()=>{
    const left=Math.max(0,from-(performance.now()-start)/1000);q.left=left;
    const b=$("#tb");if(b){b.style.width=(left/TIME*100)+"%";$("#tm").classList.toggle("low",left<6)}
    if(left<=0){answer(-1);return}
    timerId=requestAnimationFrame(tick);
  };timerId=requestAnimationFrame(tick);
}
function stopTimer(){if(timerId)cancelAnimationFrame(timerId);timerId=null}
function answer(j){
  const q=G.list[G.i];
  if(G.view!==G.i||q.chosen!==undefined)return;
  stopTimer();G.answered=true;q.chosen=j;
  const ok=j>=0&&q.opts[j]===q.a;
  const m=mastered(),mi=mistakes();
  let gained=0;
  if(ok){G.combo++;G.right++;G.maxCombo=Math.max(G.maxCombo,G.combo);gained=Math.round((100+(G.calm?0:q.left*5))*mult());G.score+=gained;m[q.id]=1;delete mi[q.id]}
  else{G.combo=0;if(!G.calm)G.lives--;delete m[q.id];mi[q.id]={id:q.id,tag:q.tag,q:q.q,a:q.a,w:q.w,x:q.x};G.wrong.push(q)}
  store.set("mastered",m);store.set("mistakes",mi);saveGame();
  renderQ();
  if(ok){const f=document.createElement("div");f.className="float";f.textContent="+"+gained;document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
  if(ok&&!q.x){setTimeout(()=>{if(G&&G.view===G.i&&G.list[G.i]===q){G.i++;nextQ()}},900)}
  else{const fb=$("#fb .fb");if(fb)fb.scrollIntoView({block:"nearest",behavior:"smooth"});const n=$("#next");if(n)n.focus({preventScroll:true})}
}
function endGame(){
  stopTimer();store.set("game",null);window.scrollTo(0,0);
  const total=G.right+G.wrong.length;
  const best=store.get("best",0);const isBest=G.score>best;if(isBest)store.set("best",G.score);
  const pct=total?Math.round(G.right/total*100):0;
  const rank=pct>=90?"Пиаролог":pct>=75?"PR-менеджер":pct>=50?"Стажёр пресс-службы":"Публика (пока)";
  app.innerHTML=`<div class="end">
  <p class="progress">${G.calm||G.lives>0?"игра окончена":"жизни закончились"}</p>
  <div class="big">${G.score}</div>
  <p><span class="rank">${rank}</span></p>
  <div class="stats" style="justify-content:center;margin-top:12px"><span class="stat">верно ${G.right}/${total}</span><span class="stat">лучшая серия ${G.maxCombo}</span><span class="stat">${isBest?"новый рекорд!":"рекорд "+Math.max(best,G.score)}</span></div>
  <div class="row center" style="margin-top:16px"><button class="btn" id="again">Ещё раз</button>${G.wrong.length?`<button class="btn ghost" id="fix">Разобрать ошибки (${G.wrong.length})</button>`:""}<button class="btn ghost" id="menu">Меню</button></div>
  </div>
  ${G.wrong.length?`<h2>Запомни</h2>${G.wrong.map(w=>`<div class="miss"><b>${esc(w.q)}</b><span>${esc(w.a)}</span></div>`).join("")}`:""}`;
  const k=G.k;
  $("#again").onclick=()=>startGame(k);
  $("#menu").onclick=home;
  if(G.wrong.length)$("#fix").onclick=()=>startGame("mistakes");
}

// ===== флэш-карточки =====
let F=null;
function startFlash(d){
  const items=d==="terms"?TERMS.map(t=>({t:t[0],d:t[1],x:t[2]})):PEOPLE.map(p=>({t:p[0],d:p[2],x:p[1]}));
  F={d,queue:shuffle(items),total:items.length,known:0,on:false,hist:[]};drawFlash();
}
function flashBack(){
  const h=F.hist.pop();if(!h)return;
  if(h.k)F.known--;else{const i=F.queue.lastIndexOf(h.c);if(i>=0)F.queue.splice(i,1)}
  F.queue.unshift(h.c);F.on=true;drawFlash();
}
function drawFlash(){
  stopTimer();
  if(!F.queue.length){app.innerHTML=`<div class="end"><div class="big">Всё!</div><p>Все ${F.total} карточек выучены. Теперь проверь себя в игре.</p><div class="row center"><button class="btn" id="play">Играть</button><button class="btn ghost" id="menu">Меню</button></div></div>`;
    $("#play").onclick=()=>startGame(F.d==="terms"?"terms":"people");$("#menu").onclick=home;return}
  const c=F.queue[0];
  app.innerHTML=`<div class="hud"><span class="progress">${F.d==="terms"?"термины":"персоналии"}</span><span class="stat">выучено ${F.known}/${F.total}</span></div>
  <div class="timer"><i style="width:${F.known/F.total*100}%;background:var(--ok)"></i></div>
  <div class="flip ${F.on?"on":""}" id="fl"><div class="flip-in" tabindex="0" role="button" aria-label="Перевернуть карточку">
    <div class="face"><span class="hint">${F.d==="terms"?"что это?":"чем известен?"}</span><div class="t">${esc(c.t)}</div><span class="hint">нажми, чтобы перевернуть</span></div>
    <div class="face back"><div class="t" style="font-size:16px;color:var(--muted)">${esc(c.t)}</div><div class="d">${esc(c.d)}</div>${c.x?`<div class="x">${esc(c.x)}</div>`:""}</div>
  </div></div>
  <div class="row center"><button class="btn no" id="no">Не знаю</button><button class="btn yes" id="yes">Знаю</button></div>
  <p class="hint" style="text-align:center">пробел — перевернуть · ← не знаю · → знаю · Backspace — назад</p>
  <div class="row center"><button class="btn ghost" id="fback" ${F.hist.length?"":"disabled style='opacity:.4'"}>← Назад</button><button class="btn ghost" id="menu">Меню</button></div>`;
  $("#fl").onclick=()=>{F.on=!F.on;$("#fl").classList.toggle("on",F.on)};
  $("#yes").onclick=()=>{const x=F.queue.shift();F.hist.push({c:x,k:1});F.known++;F.on=false;drawFlash()};
  $("#no").onclick=()=>{const x=F.queue.shift();F.queue.splice(Math.min(3,F.queue.length),0,x);F.hist.push({c:x,k:0});F.on=false;drawFlash()};
  $("#fback").onclick=flashBack;
  $("#menu").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if($("#fl")){if(e.code==="Space"){e.preventDefault();$("#fl").click()}if(e.key==="ArrowRight")$("#yes").click();if(e.key==="ArrowLeft")$("#no").click();if(e.key==="Backspace"){e.preventDefault();flashBack()}return}
  if(!G||!app.querySelector(".qcard"))return;
  if(e.key==="ArrowLeft"||e.key==="Backspace"){e.preventDefault();goBack();return}
  if(e.key==="ArrowRight"&&G.view<G.i){goFwd();return}
  if(G.view===G.i&&/^[1-4]$/.test(e.key)){const b=app.querySelector(`.ans[data-j="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}
  else if(e.key==="Enter"){const n=$("#next")||$("#fwd");if(n&&!n.hidden){e.preventDefault();n.click()}}
});
$("#home").onclick=e=>{e.preventDefault();G=null;home()};
home();
</script>
</body>
</html>
